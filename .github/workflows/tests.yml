name : Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
     - name: Obtener código
       uses: actions/checkout@v3
       
     - name: Instalar Python
       uses: actions/setup-python@v4
       with:
        python-version: '3.11'


     - name: Instalar dependencias
       run: pip install requests fastapi uvicorn pytest
     - name: Correr pruebas
       run: pytest test_buscador.py -v